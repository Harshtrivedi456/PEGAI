<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Career Case File — AI Persona Counsellor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #ECE6D6;
    --paper-dark: #E1D9C4;
    --card: #F6F2E7;
    --ink: #2B2438;
    --ink-soft: #5B5468;
    --line: #C9BFA4;
    --tech: #3457D5;
    --hr: #B5602C;
    --acad: #3F6C51;
    --entre: #B4841E;
    --danger: #A23B2E;
    --radius: 2px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  ::selection{ background: var(--tech); color: #fff; }

  .wrap{
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }

  /* ---------- Header / letterhead ---------- */
  header{
    border-bottom: 3px double var(--ink);
    padding-bottom: 18px;
    margin-bottom: 32px;
    display:flex;
    justify-content: space-between;
    align-items:flex-end;
    gap: 20px;
    flex-wrap: wrap;
  }
  .brand-eyebrow{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(30px, 5vw, 44px);
    margin: 0;
    line-height: 1.05;
  }
  h1 em{ font-style: italic; font-weight: 500; color: var(--hr); }
  .file-stamp{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    padding: 6px 10px;
    letter-spacing: 0.08em;
    transform: rotate(-2deg);
    white-space: nowrap;
  }

  /* ---------- Index card (question) ---------- */
  .index-card{
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 4px 4px 0 rgba(43,36,56,0.08);
    padding: 24px;
    margin-bottom: 28px;
    position: relative;
  }
  .index-card::before{
    content:"";
    position:absolute;
    left: 46px; top:0; bottom:0;
    width: 1px;
    background: rgba(165,50,50,0.18);
  }
  .label{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    display:block;
    margin-bottom: 8px;
  }
  textarea#question{
    width: 100%;
    min-height: 84px;
    resize: vertical;
    font-family: 'Fraunces', serif;
    font-size: 18px;
    line-height: 1.5;
    border: none;
    background: transparent;
    padding: 0 0 0 34px;
    color: var(--ink);
    outline: none;
  }
  textarea#question::placeholder{ color: #9d947f; font-style: italic; }

  /* ---------- Persona folder tabs ---------- */
  .personas-title{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 12px;
  }
  .folders{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }
  .folder{
    --accent: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 6px solid var(--accent);
    padding: 14px 14px 12px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
    position: relative;
    user-select: none;
  }
  .folder:hover{ transform: translateY(-2px); box-shadow: 3px 3px 0 rgba(43,36,56,0.10); }
  .folder input{ position:absolute; opacity:0; }
  .folder .top-row{ display:flex; align-items:center; justify-content: space-between; }
  .folder .initials{
    font-family:'Space Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    border-radius: 50%;
    width: 30px; height: 30px;
    display:flex; align-items:center; justify-content:center;
  }
  .folder .check{
    width: 18px; height:18px;
    border: 1.5px solid var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    font-size: 12px;
    color: transparent;
    flex-shrink:0;
  }
  .folder input:checked ~ .top-row .check{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .folder input:checked ~ .top-row .check::after{ content:"✓"; }
  .folder input:focus-visible ~ .top-row .check{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .folder .name{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 16px;
    margin: 10px 0 3px;
  }
  .folder .tagline{
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.4;
    margin: 0 0 10px;
  }
  .folder .toggle-card{
    font-family:'Space Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .prompt-card-detail{
    display:none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    font-size: 12px;
    line-height: 1.55;
  }
  .prompt-card-detail.open{ display:block; }
  .prompt-card-detail dt{
    font-family:'Space Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-top: 8px;
  }
  .prompt-card-detail dt:first-child{ margin-top:0; }
  .prompt-card-detail dd{ margin: 2px 0 0; color: var(--ink); }

  /* accent bindings */
  #folder-technical{ --accent: var(--tech); }
  #folder-hr{ --accent: var(--hr); }
  #folder-academic{ --accent: var(--acad); }
  #folder-entrepreneurship{ --accent: var(--entre); }

  /* ---------- API key row ---------- */
  .key-row{
    display:flex; gap:10px; align-items:center;
    flex-wrap: wrap;
    margin-bottom: 22px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .key-row input{
    font-family:'Space Mono', monospace;
    font-size: 12px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    flex: 1;
    min-width: 220px;
  }
  .key-row a{ color: var(--tech); }

  /* ---------- Generate button ---------- */
  .stamp-btn{
    font-family:'Space Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    padding: 14px 26px;
    cursor: pointer;
    transform: rotate(-1deg);
    transition: transform .12s ease, background .12s ease;
  }
  .stamp-btn:hover{ transform: rotate(0deg) scale(1.02); background: var(--hr); border-color: var(--hr); }
  .stamp-btn:disabled{ opacity: 0.5; cursor: not-allowed; transform:none; }
  .stamp-btn:focus-visible{ outline: 3px solid var(--tech); outline-offset: 3px; }

  .btn-row{ display:flex; align-items:center; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
  .spinner{
    display:none;
    font-family:'Space Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .spinner.active{ display:inline-flex; align-items:center; gap:8px; }
  .spinner .dot{
    width: 6px; height:6px; background: var(--hr); border-radius:50%;
    animation: pulse 1s infinite ease-in-out;
  }
  .spinner .dot:nth-child(2){ animation-delay: .15s; }
  .spinner .dot:nth-child(3){ animation-delay: .3s; }
  @keyframes pulse{ 0%,100%{ opacity:.25; } 50%{ opacity:1; } }

  /* ---------- Error banner ---------- */
  .banner{
    display:none;
    border: 1.5px solid var(--danger);
    color: var(--danger);
    background: #F8EDE9;
    padding: 12px 16px;
    font-size: 13.5px;
    margin: 18px 0;
    font-family: 'Inter', sans-serif;
  }
  .banner.show{ display:block; }

  /* ---------- Responses ---------- */
  #results{ margin-top: 36px; }
  .results-title{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 18px;
    margin-bottom: 16px;
  }
  .memos{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
  }
  .memo{
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 3px 3px 0 rgba(43,36,56,0.06);
    padding: 0 0 18px;
  }
  .memo .memo-head{
    border-bottom: 2px solid var(--accent, var(--ink));
    padding: 14px 18px 10px;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .memo .memo-head .initials{
    font-family:'Space Mono', monospace;
    font-weight:700; font-size:13px;
    border: 1.5px solid var(--accent, var(--ink));
    color: var(--accent, var(--ink));
    border-radius:50%;
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .memo .memo-head .name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 15.5px;
  }
  .memo .memo-body{
    padding: 14px 18px 0;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
  }

  /* ---------- Comparison ---------- */
  .compare-wrap{ margin-top: 30px; overflow-x:auto; }
  table.compare{
    width:100%;
    border-collapse: collapse;
    font-size: 13px;
    background: var(--card);
  }
  table.compare th, table.compare td{
    border: 1px solid var(--line);
    padding: 10px 12px;
    text-align: left;
    vertical-align: top;
  }
  table.compare th{
    font-family:'Space Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: var(--paper-dark);
  }
  table.compare td:first-child{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  footer{
    margin-top: 60px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    color: var(--ink-soft);
    font-family: 'Space Mono', monospace;
  }

  @media (prefers-reduced-motion: reduce){
    .folder, .stamp-btn, .dot{ transition:none; animation:none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="brand-eyebrow">Confidential — Student Advisory File</p>
      <h1>The Career <em>Case File</em></h1>
    </div>
    <div class="file-stamp">FOUR COUNSELLORS · ONE FILE</div>
  </header>

  <div class="index-card">
    <label class="label" for="question">Your question, for the record</label>
    <textarea id="question" placeholder="e.g. I know Python and basic Machine Learning. What should I learn to become an AI Engineer?"></textarea>
  </div>

  <p class="personas-title">Assign counsellors to the case</p>
  <div class="folders" id="folders"></div>

  <div class="key-row">
    <label for="apiKey">Gemini API key (kept only in your browser):</label>
    <input type="password" id="apiKey" placeholder="Paste your key — see README for how to get one" autocomplete="off" />
  </div>

  <div class="btn-row">
    <button class="stamp-btn" id="generateBtn">Get Career Advice</button>
    <span class="spinner" id="spinner"><span class="dot"></span><span class="dot"></span><span class="dot"></span> consulting the panel…</span>
  </div>

  <div class="banner" id="errorBanner"></div>

  <div id="results"></div>

  <footer>
    Prompt Card architecture: Role + Audience + Context + Format + Constraints + Language — combined once per request, never per persona.
  </footer>
</div>

<script>
/* =========================================================
   PERSONA DEFINITIONS — each is a full Prompt Card
   ========================================================= */
const PERSONAS = [
  {
    id: "technical",
    name: "Technical Career Counsellor",
    initials: "TC",
    tagline: "AI/ML, programming, software development, technical skills, projects.",
    card: {
      role: "Senior Technical Career Counsellor specializing in AI, ML, and Software Engineering, with deep knowledge of the current tech hiring landscape.",
      audience: "An undergraduate or early-career student in Computer Science / IT, evaluating technical skill gaps and project direction.",
      context: "The student is asking a career question. Consider what technical skills, tools, languages, and project experience are relevant to their situation, and where they likely stand today.",
      format: "Short recommendation, then a 'Skills to Develop' list, then a 'Project Suggestions' list, then a brief roadmap (next 3-6 months).",
      constraints: "Give practical, realistic advice grounded in current industry norms. Do not guarantee jobs, salaries, or outcomes. Do not invent facts about the student you don't know. If the question has nothing to do with technical/engineering career matters, say plainly that this is outside your lane as the Technical Counsellor and that you don't know — do not attempt to answer it anyway.",
      language: "Simple, direct English. Minimal jargon; define any technical term you use."
    }
  },
  {
    id: "hr",
    name: "HR & Placement Counsellor",
    initials: "HR",
    tagline: "Resumes, interviews, employability, recruitment, placement prep.",
    card: {
      role: "HR & Campus Placement Counsellor with experience screening resumes and running interview panels for entry-level hires.",
      audience: "A student preparing to enter the job market, who needs to think about employability rather than pure technical depth.",
      context: "The student is asking a career question. Consider how it affects their resume story, interview readiness, communication skills, and overall employability, not their technical curriculum.",
      format: "Short recommendation, then 'Resume & Positioning' notes, then 'Interview Preparation' notes, then a short action plan.",
      constraints: "Stay focused on employability, recruitment process, and soft-skill readiness — avoid deep technical curriculum advice, that is not your lane. Do not guarantee placement outcomes or salaries. If the question has nothing to do with placements, resumes, interviews, or employability, say plainly that this is outside your lane as the HR & Placement Counsellor and that you don't know.",
      language: "Simple, warm, professional English."
    }
  },
  {
    id: "academic",
    name: "Academic & Research Counsellor",
    initials: "AC",
    tagline: "Higher studies, MS/M.Tech, PhD, research, certifications.",
    card: {
      role: "Academic & Research Career Counsellor experienced in guiding students toward graduate study, research careers, and certifications.",
      audience: "A student weighing further study, research, or credentialing against other paths.",
      context: "The student is asking a career question. Consider it strictly through the lens of higher education: relevant MS/M.Tech/PhD paths, research exposure, publications, and certifications — not job-market or startup framing.",
      format: "Short recommendation, then 'Academic Pathways' options, then 'How to Prepare' (exams, research exposure, LORs), then a realistic timeline.",
      constraints: "Give balanced, realistic guidance — do not oversell research or graduate study as automatically superior. Do not guarantee admission outcomes. If the question has nothing to do with higher studies, research, or certifications, say plainly that this is outside your lane as the Academic & Research Counsellor and that you don't know.",
      language: "Simple, precise English."
    }
  },
  {
    id: "entrepreneurship",
    name: "Entrepreneurship Counsellor",
    initials: "EC",
    tagline: "Startups, business ideas, freelancing, product development.",
    card: {
      role: "Entrepreneurship & Startup Career Counsellor who has advised early-stage founders and student freelancers.",
      audience: "A student curious about building something of their own instead of, or alongside, a conventional job or further study.",
      context: "The student is asking a career question. Consider it through the lens of building: startup ideas, freelancing, product thinking, and market validation — not employment or academia.",
      format: "Short recommendation, then 'Opportunities to Explore', then 'Skills & Validation Steps', then a realistic first-90-days plan.",
      constraints: "Be honest about risk — do not romanticize entrepreneurship or guarantee success. Ground suggestions in market validation, not just enthusiasm. If the question has nothing to do with startups, freelancing, or building products/businesses, say plainly that this is outside your lane as the Entrepreneurship Counsellor and that you don't know.",
      language: "Simple, energetic but grounded English."
    }
  }
];

const ACCENT_VAR = {
  technical: "var(--tech)",
  hr: "var(--hr)",
  academic: "var(--acad)",
  entrepreneurship: "var(--entre)"
};

/* =========================================================
   RENDER PERSONA FOLDERS
   ========================================================= */
const foldersEl = document.getElementById("folders");
PERSONAS.forEach(p => {
  const card = p.card;
  const el = document.createElement("label");
  el.className = "folder";
  el.id = `folder-${p.id}`;
  el.innerHTML = `
    <input type="checkbox" class="persona-check" value="${p.id}" />
    <div class="top-row">
      <span class="initials">${p.initials}</span>
      <span class="check" aria-hidden="true"></span>
    </div>
    <p class="name">${p.name}</p>
    <p class="tagline">${p.tagline}</p>
    <button type="button" class="toggle-card">view prompt card</button>
    <dl class="prompt-card-detail">
      <dt>Role</dt><dd>${card.role}</dd>
      <dt>Audience</dt><dd>${card.audience}</dd>
      <dt>Context</dt><dd>${card.context}</dd>
      <dt>Format</dt><dd>${card.format}</dd>
      <dt>Constraints</dt><dd>${card.constraints}</dd>
      <dt>Language</dt><dd>${card.language}</dd>
    </dl>
  `;
  foldersEl.appendChild(el);

  el.querySelector(".toggle-card").addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    el.querySelector(".prompt-card-detail").classList.toggle("open");
  });
});

/* =========================================================
   API KEY — kept only in this browser's localStorage
   ========================================================= */
const apiKeyInput = document.getElementById("apiKey");
apiKeyInput.value = localStorage.getItem("gemini_api_key") || "";
apiKeyInput.addEventListener("change", () => {
  localStorage.setItem("gemini_api_key", apiKeyInput.value.trim());
});

/* =========================================================
   PROMPT CONSTRUCTION
   Combines every selected persona's Prompt Card + the user's
   question into ONE structured prompt for ONE Gemini request.
   ========================================================= */
function buildPrompt(question, selectedPersonas){
  const personaBlocks = selectedPersonas.map(p => {
    const c = p.card;
    return `PERSONA_ID: ${p.id}
Role: ${c.role}
Audience: ${c.audience}
Context: ${c.context}
Format: ${c.format}
Constraints: ${c.constraints}
Language: ${c.language}`;
  }).join("\n\n");

  return `You are simulating a panel of ${selectedPersonas.length} distinct career-counsellor personas, each fully described below by a Prompt Card (Role, Audience, Context, Format, Constraints, Language). A student has asked ONE question. Answer AS EACH PERSONA SEPARATELY, strictly following that persona's own Prompt Card. The personas must give genuinely different perspectives that reflect their distinct roles — do not let them converge on the same generic advice. If the question is outside a given persona's lane, that persona must say so and respond with "I don't know" for their "response" field, per their own Constraints.

STUDENT QUESTION:
"""${question}"""

PERSONA PANEL:
${personaBlocks}

Respond with ONLY a single valid JSON object (no markdown fences, no commentary) with this exact shape:
{
  "personas": {
    "<persona_id>": {
      "response": "<the full persona response, formatted per that persona's Format field, using \\n for line breaks>",
      "mainRecommendation": "<3-6 word summary of their core recommendation>",
      "priority": "<3-6 word summary of what they'd prioritize first>",
      "suggestedAction": "<3-6 word summary of the single next action>"
    }
    ${selectedPersonas.length > 1 ? "// one entry per PERSONA_ID above" : ""}
  }
}`;
}

/* =========================================================
   GEMINI API CALL — one request for all selected personas
   ========================================================= */
async function callGemini(prompt, apiKey){
  const model = "gemini-3.6-flash";
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;

  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.7, responseMimeType: "application/json" }
    })
  });

  if (!res.ok) {
    let detail = "";
    try { const j = await res.json(); detail = j?.error?.message || ""; } catch(e) {}
    throw new Error(`Gemini API error (${res.status}). ${detail || "Please check your API key and try again."}`);
  }

  const data = await res.json();
  const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
  if (!text) throw new Error("Gemini returned an empty response. Please try again.");

  const cleaned = text.replace(/^```json\s*|```$/g, "").trim();
  let parsed;
  try {
    parsed = JSON.parse(cleaned);
  } catch(e) {
    throw new Error("Could not parse the model's response as JSON. Please try again.");
  }
  return parsed;
}

/* =========================================================
   UI HELPERS
   ========================================================= */
const errorBanner = document.getElementById("errorBanner");
function showError(msg){
  errorBanner.textContent = msg;
  errorBanner.classList.add("show");
}
function clearError(){
  errorBanner.textContent = "";
  errorBanner.classList.remove("show");
}

function renderResults(selectedPersonas, personaResults){
  const resultsEl = document.getElementById("results");
  resultsEl.innerHTML = "";

  const title = document.createElement("p");
  title.className = "results-title";
  title.textContent = "Counsellor responses";
  resultsEl.appendChild(title);

  const memos = document.createElement("div");
  memos.className = "memos";

  selectedPersonas.forEach(p => {
    const r = personaResults[p.id] || {};
    const memo = document.createElement("div");
    memo.className = "memo";
    memo.style.setProperty("--accent", ACCENT_VAR[p.id]);
    memo.innerHTML = `
      <div class="memo-head">
        <span class="initials">${p.initials}</span>
        <span class="name">${p.name}</span>
      </div>
      <div class="memo-body">${(r.response || "No response received.").trim()}</div>
    `;
    memos.appendChild(memo);
  });

  resultsEl.appendChild(memos);

  if (selectedPersonas.length > 1) {
    const compareWrap = document.createElement("div");
    compareWrap.className = "compare-wrap";
    const cols = selectedPersonas.map(p => p.name).join("</th><th>");
    const rows = ["mainRecommendation", "priority", "suggestedAction"];
    const rowLabels = {
      mainRecommendation: "Main recommendation",
      priority: "Priority",
      suggestedAction: "Suggested action"
    };
    let bodyRows = "";
    rows.forEach(rowKey => {
      bodyRows += `<tr><td>${rowLabels[rowKey]}</td>`;
      selectedPersonas.forEach(p => {
        const r = personaResults[p.id] || {};
        bodyRows += `<td>${(r[rowKey] || "—")}</td>`;
      });
      bodyRows += `</tr>`;
    });
    compareWrap.innerHTML = `
      <p class="results-title" style="border-top:none;">Comparison</p>
      <table class="compare">
        <thead><tr><th>Aspect</th><th>${cols}</th></tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    `;
    resultsEl.appendChild(compareWrap);
  }
}

/* =========================================================
   GENERATE HANDLER
   ========================================================= */
const generateBtn = document.getElementById("generateBtn");
const spinner = document.getElementById("spinner");

generateBtn.addEventListener("click", async () => {
  clearError();
  document.getElementById("results").innerHTML = "";

  const question = document.getElementById("question").value.trim();
  const checked = Array.from(document.querySelectorAll(".persona-check:checked")).map(c => c.value);
  const apiKey = apiKeyInput.value.trim();

  if (checked.length === 0) {
    showError("Please select at least one persona.");
    return;
  }
  if (!question) {
    showError("Please enter your career-related question.");
    return;
  }
  if (!apiKey) {
    showError("Please paste a Gemini API key above before requesting advice.");
    return;
  }

  const selectedPersonas = PERSONAS.filter(p => checked.includes(p.id));
  const prompt = buildPrompt(question, selectedPersonas);

  generateBtn.disabled = true;
  spinner.classList.add("active");

  try {
    const parsed = await callGemini(prompt, apiKey);
    const personaResults = parsed?.personas || {};
    renderResults(selectedPersonas, personaResults);
  } catch (err) {
    showError(err.message || "Something went wrong talking to the Gemini API. Please try again.");
  } finally {
    generateBtn.disabled = false;
    spinner.classList.remove("active");
  }
});
</script>
